name: Windows PowerShell validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse all PowerShell files
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors -join '; ')"
            }
            else {
              Write-Host "PASS $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Validate config example JSON
        shell: powershell
        run: |
          Get-Content .\config.example.json -Raw | ConvertFrom-Json | Out-Null
          Write-Host "PASS config.example.json"

      - name: Run Telegram unit tests
        shell: powershell
        run: .\tests\telegram-unit.ps1

      - name: Guard Windows PowerShell 5.1 Dashboard regressions
        shell: powershell
        run: |
          $source = Get-Content .\dashboard-sync.ps1 -Raw
          if ($source -match '(?im)^\s*\$pid\s*=') {
            throw 'dashboard-sync.ps1 must not assign to the readonly $PID automatic variable.'
          }
          if ($source -notmatch '\[System\.Text\.Encoding\]::UTF8\.GetBytes\(\$payload\)') {
            throw 'Dashboard upload must explicitly encode JSON as UTF-8 bytes.'
          }
          if ($source -notmatch 'ReadAllText\(\$stdoutPath,\s*\$utf8NoBom\)') {
            throw 'gh JSON must be read explicitly as UTF-8 on Windows PowerShell 5.1.'
          }
          if ($source -match '2>&1') {
            throw 'Do not merge gh stderr into JSON stdout.'
          }
          Write-Host 'PASS Windows PowerShell 5.1 Dashboard guards'

      - name: Enforce remote-command safety boundary
        shell: powershell
        run: |
          $source = Get-ChildItem -Path . -Filter *.ps1 -Recurse | Get-Content -Raw
          $forbidden = @(
            'Invoke-Expression',
            'iex ',
            '/exec',
            '/cmd',
            '/powershell'
          )
          foreach ($item in $forbidden) {
            if ($source -match [regex]::Escape($item)) {
              throw "Forbidden remote-command surface found: $item"
            }
          }
          Write-Host "PASS safety boundary"
